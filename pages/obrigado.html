<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Obrigado — Aura NØVA</title>
  <meta name="description" content="Encomenda confirmada na Aura NØVA.">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" sizes="32x32" href="../img/favicon-32.png">
  <link rel="icon" type="image/svg+xml" href="../img/favicon.svg">
  <link rel="apple-touch-icon" href="../img/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="header">
    <div class="header-left">
      <a href="../index.html" class="logo"><span class="logo-aura">Aura</span> NØVA</a>
    </div>
  </header>

  <main style="min-height:70vh;display:flex;align-items:center;justify-content:center;padding:2rem;">
    <div id="success-content" style="text-align:center;max-width:480px;">
      <div style="width:64px;height:64px;margin:0 auto 1.5rem;background:var(--green-light);border-radius:50%;display:flex;align-items:center;justify-content:center;">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--green)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      </div>
      <h1 style="font-size:1.75rem;font-weight:800;margin-bottom:0.5rem;">Encomenda confirmada!</h1>
      <p id="order-number" style="font-size:1rem;color:var(--text-muted);margin-bottom:0.5rem;"></p>
      <p style="font-size:0.9rem;color:var(--text-muted);margin-bottom:0.5rem;">Vais receber um email com os detalhes da encomenda.</p>
      <p style="font-size:0.85rem;color:var(--text-muted);margin-bottom:2rem;">Prazo de entrega: 2-5 dias úteis</p>
      <a href="../index.html" style="display:inline-flex;align-items:center;gap:0.5rem;padding:0.75rem 2rem;background:linear-gradient(135deg,var(--accent),#dc2f02);color:#fff;border-radius:var(--radius-sm);font-weight:700;text-decoration:none;transition:var(--transition);">
        Continuar a comprar
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3"/></svg>
      </a>
    </div>

    <div id="error-content" style="text-align:center;max-width:480px;display:none;">
      <div style="width:64px;height:64px;margin:0 auto 1.5rem;background:rgba(220,38,38,0.08);border-radius:50%;display:flex;align-items:center;justify-content:center;">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z"/></svg>
      </div>
      <h1 style="font-size:1.75rem;font-weight:800;margin-bottom:0.5rem;">Pagamento cancelado</h1>
      <p style="font-size:0.9rem;color:var(--text-muted);margin-bottom:2rem;">O pagamento não foi concluído. Podes tentar novamente.</p>
      <a href="../index.html" style="display:inline-flex;align-items:center;gap:0.5rem;padding:0.75rem 2rem;background:linear-gradient(135deg,var(--accent),#dc2f02);color:#fff;border-radius:var(--radius-sm);font-weight:700;text-decoration:none;">
        Voltar à loja
      </a>
    </div>
  </main>

  <footer class="footer" style="margin-top:0;">
    <div class="footer-bottom">
      <p>&copy; 2026 Aura NØVA. Todos os direitos reservados.</p>
    </div>
  </footer>

  <script>
    const params = new URLSearchParams(window.location.search);
    const orderNumber = params.get('order');
    const cancelled = params.get('cancel');

    if (cancelled === '1') {
      document.getElementById('success-content').style.display = 'none';
      document.getElementById('error-content').style.display = 'block';
    } else if (orderNumber) {
      const el = document.getElementById('order-number');
      const strong = document.createElement('strong');
      strong.textContent = orderNumber;
      el.textContent = 'Número da encomenda: ';
      el.appendChild(strong);
    } else {
      document.getElementById('order-number').textContent = 'A processar a tua encomenda...';
    }

    // Limpar carrinho
    localStorage.removeItem('auranova_cart');
    localStorage.removeItem('auranova_coupon_applied');
  </script>
</body>
</html>
