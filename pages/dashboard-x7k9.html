<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aura NØVA — Dashboard</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" sizes="32x32" href="../img/favicon-32.png">
  <link rel="icon" type="image/svg+xml" href="../img/favicon.svg">
  <link rel="apple-touch-icon" href="../img/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #f5f5f5; color: #111; }
    .admin-header { background: #0f0f0f; color: #fff; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
    .admin-header h1 { font-size: 1.1rem; font-weight: 700; }
    .admin-header a { color: #e85d04; text-decoration: none; font-size: 0.85rem; font-weight: 600; }
    .admin-container { max-width: 1200px; margin: 2rem auto; padding: 0 2rem; }

    /* Login */
    .login-container { max-width: 400px; margin: 8rem auto; padding: 2rem; background: #fff; border-radius: 12px; border: 1px solid #e8e6e1; }
    .login-container h1 { text-align: center; margin-bottom: 1.5rem; font-size: 1.3rem; }
    .login-error { background: rgba(220,38,38,0.08); color: #dc2626; padding: 0.75rem; border-radius: 8px; font-size: 0.85rem; margin-bottom: 1rem; display: none; }

    /* Stats */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
    .stat-card { background: #fff; border: 1px solid #e8e6e1; border-radius: 12px; padding: 1.5rem; }
    .stat-card label { display: block; font-size: 0.75rem; color: #6b6b6b; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.5rem; }
    .stat-card strong { font-size: 1.75rem; font-weight: 800; }
    .stat-card.accent strong { color: #e85d04; }
    .stat-card.green strong { color: #16a34a; }

    /* Sections */
    .section { background: #fff; border: 1px solid #e8e6e1; border-radius: 12px; padding: 1.5rem; margin-bottom: 2rem; }
    .section h2 { font-size: 1rem; font-weight: 700; margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center; }
    .section h2 .count { font-size: 0.78rem; background: #e85d04; color: #fff; padding: 0.15rem 0.55rem; border-radius: 50px; font-weight: 600; }

    /* Tabs */
    .tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; border-bottom: 1px solid #e8e6e1; padding-bottom: 0.5rem; }
    .tab { padding: 0.5rem 1rem; font-size: 0.85rem; font-weight: 600; color: #6b6b6b; background: none; border: none; cursor: pointer; border-radius: 8px; transition: all 0.2s; font-family: inherit; }
    .tab:hover { background: #f5f5f5; }
    .tab.active { background: #0f0f0f; color: #fff; }

    /* Tables */
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; font-size: 0.75rem; color: #6b6b6b; text-transform: uppercase; letter-spacing: 0.5px; padding: 0.75rem; border-bottom: 1px solid #e8e6e1; }
    td { padding: 0.75rem; border-bottom: 1px solid #f5f5f5; font-size: 0.85rem; }
    tr:hover { background: #faf9f6; }

    /* Badges */
    .badge { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 50px; font-size: 0.68rem; font-weight: 600; }
    .badge-orange { background: rgba(232,93,4,0.1); color: #e85d04; }
    .badge-green { background: rgba(22,163,74,0.08); color: #16a34a; }
    .badge-gray { background: #f5f5f5; color: #6b6b6b; }
    .badge-red { background: rgba(220,38,38,0.08); color: #dc2626; }
    .badge-blue { background: rgba(59,130,246,0.08); color: #3b82f6; }

    /* Buttons */
    .btn { padding: 0.5rem 1rem; border-radius: 8px; border: none; font-size: 0.82rem; font-weight: 600; cursor: pointer; font-family: inherit; transition: all 0.2s; }
    .btn-primary { background: #e85d04; color: #fff; }
    .btn-primary:hover { background: #d45203; }
    .btn-sm { padding: 0.3rem 0.6rem; font-size: 0.75rem; }
    .btn-outline { background: transparent; border: 1px solid #e8e6e1; color: #111; }
    .btn-outline:hover { background: #f5f5f5; }
    .btn-danger { background: rgba(220,38,38,0.08); color: #dc2626; }
    .btn-danger:hover { background: rgba(220,38,38,0.15); }

    /* Forms */
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; font-size: 0.82rem; font-weight: 600; margin-bottom: 0.3rem; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 0.6rem 0.8rem; border: 1.5px solid #e8e6e1; border-radius: 8px; font-size: 0.88rem; font-family: inherit; outline: none; transition: border-color 0.2s; }
    .form-group input:focus, .form-group select:focus { border-color: #e85d04; }

    /* Order detail modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; display: none; align-items: center; justify-content: center; }
    .modal-overlay.open { display: flex; }
    .modal { background: #fff; border-radius: 14px; padding: 2rem; max-width: 600px; width: 90%; max-height: 80vh; overflow-y: auto; }
    .modal h3 { margin-bottom: 1rem; }
    .modal .detail-row { display: flex; justify-content: space-between; padding: 0.5rem 0; border-bottom: 1px solid #f5f5f5; font-size: 0.88rem; }
    .modal .detail-row:last-child { border-bottom: none; }
    .modal .detail-label { color: #6b6b6b; }

    /* Status select */
    .status-select { padding: 0.3rem; border-radius: 6px; font-size: 0.78rem; font-family: inherit; border: 1px solid #e8e6e1; cursor: pointer; }

    /* Loading */
    .loading { text-align: center; padding: 2rem; color: #6b6b6b; font-size: 0.88rem; }
    .empty { text-align: center; padding: 2rem; color: #6b6b6b; font-size: 0.85rem; }

    .logout-btn { background: transparent; border: 1px solid rgba(255,255,255,0.3); color: #fff; padding: 0.4rem 0.8rem; border-radius: 6px; font-size: 0.78rem; cursor: pointer; font-family: inherit; }
    .logout-btn:hover { background: rgba(255,255,255,0.1); }

    @media (max-width: 600px) {
      .stats-grid { grid-template-columns: 1fr 1fr; }
      .admin-container { padding: 0 1rem; }
    }
  </style>
</head>
<body>

  <!-- Login Screen -->
  <div id="login-screen">
    <div class="login-container">
      <h1>Aura NOVA — Admin</h1>
      <div class="login-error" id="login-error"></div>
      <form id="login-form">
        <div class="form-group">
          <label for="login-user">Username</label>
          <input type="text" id="login-user" placeholder="Username" required>
        </div>
        <div class="form-group">
          <label for="login-pass">Password</label>
          <input type="password" id="login-pass" placeholder="Password" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;padding:0.75rem;">Entrar</button>
      </form>
    </div>
  </div>

  <!-- Dashboard -->
  <div id="dashboard" style="display:none;">
    <div class="admin-header">
      <h1>Aura NOVA — Admin</h1>
      <div style="display:flex;gap:0.75rem;align-items:center;">
        <a href="../index.html">Voltar a loja</a>
        <button class="logout-btn" id="logout-btn">Sair</button>
      </div>
    </div>
    <div class="admin-container">

      <!-- Stats -->
      <div class="stats-grid" id="stats-grid">
        <div class="loading">A carregar...</div>
      </div>

      <!-- Tabs -->
      <div class="tabs">
        <button class="tab active" data-tab="orders">Encomendas</button>
        <button class="tab" data-tab="products">Produtos</button>
        <button class="tab" data-tab="subscribers">Subscritores</button>
        <button class="tab" data-tab="coupons">Cupões</button>
        <button class="tab" data-tab="messages">Mensagens</button>
      </div>

      <!-- Orders Tab -->
      <div class="tab-content" id="tab-orders">
        <div class="section">
          <h2>Encomendas</h2>
          <div style="margin-bottom:1rem;display:flex;gap:0.5rem;flex-wrap:wrap;">
            <select id="order-status-filter" class="status-select">
              <option value="">Todas</option>
              <option value="pending">Pendente</option>
              <option value="paid">Pago</option>
              <option value="shipped">Enviado</option>
              <option value="delivered">Entregue</option>
              <option value="cancelled">Cancelado</option>
              <option value="refunded">Reembolsado</option>
            </select>
          </div>
          <div id="orders-list"><div class="loading">A carregar encomendas...</div></div>
        </div>
      </div>

      <!-- Products Tab -->
      <div class="tab-content" id="tab-products" style="display:none;">
        <div class="section">
          <h2>Produtos <span class="count" id="products-count">0</span></h2>
          <div id="products-list"><div class="loading">A carregar produtos...</div></div>
        </div>
      </div>

      <!-- Subscribers Tab -->
      <div class="tab-content" id="tab-subscribers" style="display:none;">
        <div class="section">
          <h2>Subscritores <span class="count" id="subs-count">0</span></h2>
          <div style="margin-bottom:1rem;">
            <button class="btn btn-outline" id="export-subs-btn">Exportar CSV</button>
          </div>
          <div id="subs-list"><div class="loading">A carregar...</div></div>
        </div>
      </div>

      <!-- Coupons Tab -->
      <div class="tab-content" id="tab-coupons" style="display:none;">
        <div class="section">
          <h2>Cupões de desconto</h2>
          <div id="coupons-list"><div class="loading">A carregar...</div></div>
        </div>
      </div>

      <!-- Messages Tab -->
      <div class="tab-content" id="tab-messages" style="display:none;">
        <div class="section">
          <h2>Mensagens de contacto</h2>
          <div id="messages-list"><div class="loading">A carregar...</div></div>
        </div>
      </div>

    </div>
  </div>

  <!-- Order Detail Modal -->
  <div class="modal-overlay" id="order-modal">
    <div class="modal" id="order-modal-content"></div>
  </div>

  <script src="../js/config.js"></script>
  <script>
    // HTML escaping — previne XSS em dados da API
    function esc(str) {
      if (str === null || str === undefined) return '';
      const div = document.createElement('div');
      div.textContent = String(str);
      return div.innerHTML;
    }

    // Auth
    let token = localStorage.getItem('auranova_admin_token');
    let csrfToken = '';

    const loginScreen = document.getElementById('login-screen');
    const dashboard = document.getElementById('dashboard');
    const loginForm = document.getElementById('login-form');
    const loginError = document.getElementById('login-error');

    async function fetchCsrf() {
      try {
        const res = await fetch(`${API_BASE}/csrf-token`);
        const data = await res.json();
        csrfToken = data.token || '';
      } catch (e) { console.error('CSRF fetch error:', e); }
    }

    async function api(method, path, body) {
      if (!csrfToken && (method === 'POST' || method === 'PUT' || method === 'DELETE')) {
        await fetchCsrf();
      }
      const opts = { method, headers: { 'Content-Type': 'application/json' } };
      if (token) opts.headers['Authorization'] = 'Bearer ' + token;
      if (csrfToken && (method === 'POST' || method === 'PUT' || method === 'DELETE')) {
        opts.headers['X-CSRF-Token'] = csrfToken;
      }
      if (body) opts.body = JSON.stringify(body);
      const res = await fetch(`${API_BASE}${path}`, opts);
      if (res.status === 401) { localStorage.removeItem('auranova_admin_token'); token = null; showLogin(); throw new Error('Sessão expirada'); }
      if (res.status === 403) {
        const retry = await res.clone().json().catch(() => ({}));
        if (retry.error && retry.error.toLowerCase().includes('csrf')) {
          csrfToken = '';
          await fetchCsrf();
          opts.headers['X-CSRF-Token'] = csrfToken;
          return fetch(`${API_BASE}${path}`, opts);
        }
      }
      return res;
    }

    function showLogin() {
      loginScreen.style.display = 'block';
      dashboard.style.display = 'none';
    }

    function showDashboard() {
      loginScreen.style.display = 'none';
      dashboard.style.display = 'block';
      loadStats();
      loadOrders();
      loadProducts();
      loadSubscribers();
      loadCoupons();
      loadMessages();
    }

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('login-user').value;
      const password = document.getElementById('login-pass').value;
      try {
        const res = await fetch(`${API_BASE}/admin/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (res.ok) {
          token = data.token;
          localStorage.setItem('auranova_admin_token', token);
          showDashboard();
        } else {
          loginError.textContent = data.error || 'Credenciais inválidas';
          loginError.style.display = 'block';
        }
      } catch {
        loginError.textContent = 'Erro de ligação ao servidor';
        loginError.style.display = 'block';
      }
    });

    document.getElementById('logout-btn').addEventListener('click', async () => {
      try { await api('POST', '/admin/logout'); } catch {}
      localStorage.removeItem('auranova_admin_token');
      token = null;
      showLogin();
    });

    // Verify session on load
    async function checkAuth() {
      if (!token) { showLogin(); return; }
      try {
        const res = await api('GET', '/admin/verify');
        if (res.ok) { showDashboard(); } else { showLogin(); }
      } catch { showLogin(); }
    }

    // Stats
    async function loadStats() {
      try {
        const res = await api('GET', '/admin/stats');
        const data = await res.json();
        const s = data.stats;
        document.getElementById('stats-grid').innerHTML = `
          <div class="stat-card"><label>Receita Total</label><strong>${parseFloat(s.total_revenue || 0).toFixed(2).replace('.', ',')}€</strong></div>
          <div class="stat-card accent"><label>Encomendas</label><strong>${parseInt(s.orders_total || 0)}</strong></div>
          <div class="stat-card green"><label>Hoje</label><strong>${parseInt(s.orders_today || 0)}</strong></div>
          <div class="stat-card"><label>Pendentes</label><strong>${parseInt(s.orders_pending || 0)}</strong></div>
          <div class="stat-card"><label>Subscritores</label><strong>${parseInt(s.subscribers || 0)}</strong></div>
          <div class="stat-card"><label>Ticket Médio</label><strong>${parseFloat(s.avg_order_value || 0).toFixed(2).replace('.', ',')}€</strong></div>
        `;
      } catch (e) { console.error('Stats error:', e); }
    }

    // Orders
    const statusLabels = { pending: 'Pendente', paid: 'Pago', shipped: 'Enviado', delivered: 'Entregue', cancelled: 'Cancelado', refunded: 'Reembolsado' };
    const statusBadge = { pending: 'badge-orange', paid: 'badge-green', shipped: 'badge-blue', delivered: 'badge-green', cancelled: 'badge-red', refunded: 'badge-red' };

    async function loadOrders(status) {
      try {
        const url = status ? `/admin/orders?status=${status}` : '/admin/orders';
        const res = await api('GET', url);
        const data = await res.json();
        const orders = data.orders || [];
        const el = document.getElementById('orders-list');
        if (orders.length === 0) { el.innerHTML = '<div class="empty">Sem encomendas.</div>'; return; }
        el.innerHTML = `<table><thead><tr><th>Nº</th><th>Cliente</th><th>Total</th><th>Estado</th><th>Data</th><th></th></tr></thead><tbody>${
          orders.map(o => `<tr>
            <td><strong>${esc(o.order_number)}</strong></td>
            <td>${esc(o.customer_name)}</td>
            <td>${parseFloat(o.total).toFixed(2).replace('.', ',')}€</td>
            <td><span class="badge ${statusBadge[o.status] || 'badge-gray'}">${esc(statusLabels[o.status] || o.status)}</span></td>
            <td>${new Date(o.created_at).toLocaleDateString('pt-PT')}</td>
            <td><button class="btn btn-outline btn-sm" onclick="viewOrder(${parseInt(o.id)})">Ver</button></td>
          </tr>`).join('')
        }</tbody></table>`;
      } catch (e) { console.error('Orders error:', e); document.getElementById('orders-list').innerHTML = '<div class="empty">Erro ao carregar encomendas.</div>'; }
    }

    document.getElementById('order-status-filter').addEventListener('change', (e) => loadOrders(e.target.value));

    async function viewOrder(id) {
      try {
        const res = await api('GET', `/admin/orders/${id}`);
        const data = await res.json();
        const o = data.order;
        document.getElementById('order-modal-content').innerHTML = `
          <h3>Encomenda ${esc(o.order_number)}</h3>
          <div class="detail-row"><span class="detail-label">Cliente</span><span>${esc(o.customer_name)} ${esc(o.customer_surname || '')}</span></div>
          <div class="detail-row"><span class="detail-label">Email</span><span>${esc(o.customer_email)}</span></div>
          <div class="detail-row"><span class="detail-label">Telefone</span><span>${esc(o.customer_phone || '—')}</span></div>
          <div class="detail-row"><span class="detail-label">Morada</span><span>${esc(o.address)}</span></div>
          <div class="detail-row"><span class="detail-label">Código Postal</span><span>${esc(o.postal_code || '—')}</span></div>
          <div class="detail-row"><span class="detail-label">Cidade</span><span>${esc(o.city || '—')}</span></div>
          <div class="detail-row"><span class="detail-label">Subtotal</span><span>${parseFloat(o.subtotal).toFixed(2).replace('.', ',')}€</span></div>
          <div class="detail-row"><span class="detail-label">Desconto</span><span>${parseFloat(o.discount).toFixed(2).replace('.', ',')}€</span></div>
          <div class="detail-row"><span class="detail-label">Envio</span><span>${parseFloat(o.shipping).toFixed(2).replace('.', ',')}€</span></div>
          <div class="detail-row"><span class="detail-label" style="font-weight:700;">Total</span><span style="font-weight:700;">${parseFloat(o.total).toFixed(2).replace('.', ',')}€</span></div>
          <div class="detail-row"><span class="detail-label">Cupão</span><span>${esc(o.coupon_code || '—')}</span></div>
          <div class="detail-row"><span class="detail-label">Data</span><span>${new Date(o.created_at).toLocaleString('pt-PT')}</span></div>
          <h4 style="margin:1rem 0 0.5rem;">Artigos</h4>
          ${o.items ? o.items.map(i => `<div class="detail-row"><span>${esc(i.product_name)} x${parseInt(i.quantity)}</span><span>${parseFloat(i.unit_price * i.quantity).toFixed(2).replace('.', ',')}€</span></div>`).join('') : '<div class="empty">Sem artigos</div>'}
          <div style="margin-top:1.5rem;display:flex;gap:0.5rem;align-items:center;">
            <label style="font-size:0.82rem;font-weight:600;">Estado:</label>
            <select class="status-select" id="order-status-${o.id}" onchange="updateOrderStatus(${o.id}, this.value)">
              ${Object.entries(statusLabels).map(([k,v]) => `<option value="${k}" ${o.status===k?'selected':''}>${v}</option>`).join('')}
            </select>
          </div>
          <div style="margin-top:1rem;text-align:right;"><button class="btn btn-outline" onclick="closeModal()">Fechar</button></div>
        `;
        document.getElementById('order-modal').classList.add('open');
      } catch (e) { alert('Erro ao carregar encomenda'); }
    }

    async function updateOrderStatus(id, status) {
      try {
        await api('PUT', `/admin/orders/${id}`, { status });
        loadOrders(document.getElementById('order-status-filter').value);
      } catch { alert('Erro ao atualizar estado'); }
    }

    function closeModal() { document.getElementById('order-modal').classList.remove('open'); }
    document.getElementById('order-modal').addEventListener('click', (e) => { if (e.target === e.currentTarget) closeModal(); });

    // Products
    async function loadProducts() {
      try {
        const res = await api('GET', '/admin/products');
        const data = await res.json();
        const products = data.products || [];
        document.getElementById('products-count').textContent = products.length;
        const el = document.getElementById('products-list');
        if (products.length === 0) { el.innerHTML = '<div class="empty">Sem produtos.</div>'; return; }
        el.innerHTML = `<table><thead><tr><th>Produto</th><th>Categoria</th><th>Preço</th><th>Estado</th></tr></thead><tbody>${
          products.map(p => `<tr>
            <td><strong>${esc(p.name)}</strong></td>
            <td>${esc(p.category)}</td>
            <td>${parseFloat(p.price).toFixed(2).replace('.', ',')}€</td>
            <td><span class="badge ${p.is_active ? 'badge-green' : 'badge-red'}">${p.is_active ? 'Ativo' : 'Inativo'}</span></td>
          </tr>`).join('')
        }</tbody></table>`;
      } catch (e) { document.getElementById('products-list').innerHTML = '<div class="empty">Erro ao carregar produtos.</div>'; }
    }

    // Subscribers
    async function loadSubscribers() {
      try {
        const res = await api('GET', '/admin/subscribers');
        const data = await res.json();
        const subs = data.subscribers || [];
        document.getElementById('subs-count').textContent = subs.length;
        const el = document.getElementById('subs-list');
        if (subs.length === 0) { el.innerHTML = '<div class="empty">Sem subscritores.</div>'; return; }
        el.innerHTML = `<table><thead><tr><th>Email</th><th>Fonte</th><th>Data</th><th></th></tr></thead><tbody>${
          subs.map(s => `<tr>
            <td>${esc(s.email)}</td>
            <td><span class="badge badge-orange">${esc(s.source)}</span></td>
            <td>${new Date(s.created_at).toLocaleDateString('pt-PT')}</td>
            <td><button class="btn btn-danger btn-sm" onclick="deleteSub(${parseInt(s.id)})">Eliminar</button></td>
          </tr>`).join('')
        }</tbody></table>`;
      } catch (e) { document.getElementById('subs-list').innerHTML = '<div class="empty">Erro ao carregar subscritores.</div>'; }
    }

    async function deleteSub(id) {
      if (!confirm('Eliminar subscritor?')) return;
      await api('DELETE', `/admin/subscribers/${id}`);
      loadSubscribers();
      loadStats();
    }

    document.getElementById('export-subs-btn').addEventListener('click', () => {
      window.open(`${API_BASE}/admin/subscribers/export`, '_blank');
    });

    // Coupons
    async function loadCoupons() {
      try {
        const res = await api('GET', '/admin/coupons');
        const data = await res.json();
        const coupons = data.coupons || [];
        const el = document.getElementById('coupons-list');
        if (coupons.length === 0) { el.innerHTML = '<div class="empty">Sem cupões.</div>'; return; }
        const typeLabels = { percent: 'Percentagem', fixed: 'Valor fixo', shipping: 'Envio grátis' };
        el.innerHTML = `<table><thead><tr><th>Código</th><th>Tipo</th><th>Valor</th><th>Ped. Mín.</th><th>Usos</th><th>Estado</th></tr></thead><tbody>${
          coupons.map(c => `<tr>
            <td><span class="badge badge-orange">${esc(c.code)}</span></td>
            <td>${esc(typeLabels[c.type] || c.type)}</td>
            <td>${c.type === 'percent' ? parseInt(c.value) + '%' : parseFloat(c.value).toFixed(2).replace('.', ',') + '€'}</td>
            <td>${c.min_order > 0 ? parseFloat(c.min_order).toFixed(2).replace('.', ',') + '€' : '—'}</td>
            <td>${parseInt(c.used_count)}${c.max_uses ? '/' + parseInt(c.max_uses) : ''}</td>
            <td><span class="badge ${c.is_active ? 'badge-green' : 'badge-red'}">${c.is_active ? 'Ativo' : 'Inativo'}</span></td>
          </tr>`).join('')
        }</tbody></table>`;
      } catch (e) { document.getElementById('coupons-list').innerHTML = '<div class="empty">Erro ao carregar cupões.</div>'; }
    }

    // Messages
    async function loadMessages() {
      try {
        const res = await api('GET', '/admin/contact');
        const data = await res.json();
        const msgs = data.messages || [];
        const el = document.getElementById('messages-list');
        if (msgs.length === 0) { el.innerHTML = '<div class="empty">Sem mensagens.</div>'; return; }
        el.innerHTML = `<table><thead><tr><th>Nome</th><th>Email</th><th>Assunto</th><th>Data</th><th>Estado</th></tr></thead><tbody>${
          msgs.map(m => `<tr style="${m.is_read ? '' : 'font-weight:600;background:rgba(232,93,4,0.03);'}">
            <td>${esc(m.name)}</td>
            <td>${esc(m.email)}</td>
            <td>${esc(m.subject || '—')}</td>
            <td>${new Date(m.created_at).toLocaleDateString('pt-PT')}</td>
            <td><span class="badge ${m.is_read ? 'badge-gray' : 'badge-orange'}">${m.is_read ? 'Lida' : 'Nova'}</span></td>
          </tr>`).join('')
        }</tbody></table>`;
      } catch (e) { document.getElementById('messages-list').innerHTML = '<div class="empty">Erro ao carregar mensagens.</div>'; }
    }

    // Tabs
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
        document.getElementById('tab-' + tab.dataset.tab).style.display = 'block';
      });
    });

    // Init
    checkAuth();
  </script>
</body>
</html>
